name: Tests Workflow

on: [push]

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare to tests
        run: npm i
      - name: Tests
        run: |
          bash -e ./__tests__/test.sh
      - uses: education/autograding@v1

